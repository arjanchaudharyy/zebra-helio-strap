[package]
name = "zeppbridge-core"
version = "3.2.1"
description = "Shared data core of ZeppBridge: models, storage, migrations, normalization, queries, export and write coordination"
edition = "2021"

[features]
default = []
store = []

[lib]
name = "zeppbridge_core"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
jiff = "0.2.35"
thiserror = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
# Push to the user's own site: AES-256-GCM / P-256 (byte-compatible with crypto.mjs in ZeppBridge-Cloud)
ring = "0.17"
quick-xml = "0.41"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
rustyfit = { workspace = true }
embedded-io-adapters = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# On Linux, credentials are stored through Secret Service (GNOME Keyring / KWallet).
#
# Use `sync-secret-service`, not `async-secret-service`: the three `CredentialBackend`
# methods are synchronous, and the Tauri commands that call them run on tokio. The async path
# calls `block_on` internally, which can block the runtime from a tokio worker thread. The sync path
# uses libdbus, a blocking C library, with no second executor to block.
#
# The cost is one system library: build needs `libdbus-1-dev`, runtime needs `libdbus-1-3`.
# See docs/guides/linux.md.
#
# Do not use `linux-native` (keyutils): that store does not survive a reboot, and "pair again
# after each reboot" gets reported as a bug.
#
# Use `crypto-rust`, not `crypto-openssl`: session encryption is pure Rust, with no extra
# OpenSSL system library dependency.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = [
  "sync-secret-service",
  "crypto-rust",
] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
