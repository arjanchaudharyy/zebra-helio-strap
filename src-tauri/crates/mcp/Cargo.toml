[package]
name = "zeppbridge-mcp"
version = "3.2.1"
description = "ZeppBridge MCP server: stdio, listens on no port; every write can be undone in the app"
edition = "2021"

[features]
default = []
store = ["zeppbridge-core/store"]

[[bin]]
name = "zeppbridge-mcp"
path = "src/main.rs"

[dependencies]
zeppbridge-core = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Test fixtures must write `ai_tasks` rows directly. That table comes from a core migration, and core's
# pub(crate) conn is not reachable here, so the tests open their own connection and build a minimal shape.
rusqlite = { workspace = true }
