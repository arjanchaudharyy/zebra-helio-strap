[package]
name = "zeppbridge-cli"
version = "3.2.1"
description = "ZeppBridge command line: a non-interactive entry point for Task Scheduler / cron / agents"
edition = "2021"

[features]
default = []
store = ["zeppbridge-core/store"]

[[bin]]
name = "zeppbridge-cli"
path = "src/main.rs"

[dependencies]
zeppbridge-core = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
