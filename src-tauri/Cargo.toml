[workspace]
members = ["crates/core", "crates/cli", "crates/mcp"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `gzip`: requests send `Accept-Encoding: gzip` and responses decompress as they stream. The daily event JSON pages
# are several MB each time (Charge, 30 days: 4.7 MB). Without compression they go over the network as is. The decompressed bytes still obey
# the `read_json_body` limit, so a compression bomb cannot exhaust memory.
reqwest = { version = "0.12", features = ["json", "cookies", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"
directories = "5.0"
tracing = "0.1"
base64 = "0.22"
# Compression for raw responses. It is already in the dependency tree (reqwest's gzip uses it). This only
# makes it a direct dependency so storage can use it explicitly.
flate2 = "1"
# Encoder for FIT export. rustyfit can decode and encode FIT V2 (BSD-3-Clause).
# The other crates (fitparser / fit_file / fit) can only read, not write.
rustyfit = "0.10.2"
# rustyfit's Write/Seek are embedded-io traits. This adapter wraps std's
# Cursor<Vec<u8>> in them.
embedded-io-adapters = { version = "0.7", features = ["std"] }
zeppbridge-core = { path = "crates/core" }

[package]
name = "zeppbridge"
version = "3.2.1"
description = "Local-first Zepp health data bridge"
authors = ["ZeppBridge"]
edition = "2021"

[features]
default = ["github-updater"]
github-updater = ["dep:tauri-plugin-updater"]
store = ["zeppbridge-core/store"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zeppbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# The new Cargo OUT_DIR layout (target/<profile>/build/<pkg>/<hash>/out) needs tauri-build >= 2.7.4.
# Old versions derive target_dir from three fixed parent levels, land in build/, and try to delete the sidecar build directory with the same name.
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
zeppbridge-core = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
# Zebra: talk to the Helio Strap over Bluetooth (live heart rate, battery).
btleplug = "0.11"
futures = "0.3"
uuid = "1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = { version = "2.10.1", optional = true }
# Drag the prepared AI handoff file from the app straight into the browser chat box.
tauri-plugin-drag = "2.1.1"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
directories = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tauri-plugin-clipboard-manager = "=2.3.3"
# The .mcpb file that "Connect to Claude Desktop" writes is a zip. It is already in the dependency tree (the updater uses it).
# Store only, no compression: it holds a manifest and an MCP program that does not compress well.
# The portable update package is also a zip (CI builds it with Compress-Archive, deflate), so we must read deflate:
# enable only flate2, with the default pure-Rust miniz backend of flate2 below (both are already in the lock file).
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1"

# Ask the system for the user's UI language at startup. This used to spawn powershell.exe to run
# `(Get-Culture).Name`, which took 0.5 to 2 seconds on the startup path. windows-sys is already in the dependency tree
# (tauri depends on it on Windows). This only makes it a direct dependency.
# AI handoff: on Mac / Linux, put the .md on the clipboard as a file (src/clipboard_files.rs). arboard is already in the dependency tree
# (tauri-plugin-clipboard-manager brings it in). This only makes it a direct dependency.
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
# System notification for the post-run rating (src/feedback_toast.rs): a normal notification on Mac / Linux. Windows uses native WinRT notifications.
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
# The "eyes" of the fully automatic AI handoff: read the UI tree that the browser gives to screen readers (UI Automation, src/web_composer.rs).
# windows 0.61 is already in the dependency tree (tauri brings it in). This only makes it a direct dependency and turns on these modules.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    # Native notification for the post-run rating (src/feedback_toast.rs).
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    # AI handoff: put the .md on the clipboard as a file, read the foreground window title and press keys for the user in fully automatic mode (src/clipboard_files.rs).
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    # The native dialog box when startup fails (MessageBoxW). Without it, a startup failure on Windows is
    # completely silent. See the top of src/diagnostics.rs.
    "Win32_UI_WindowsAndMessaging",
    # Post-run rating notification: register the notification name, icon and zeppbridge: links (src/feedback_toast.rs).
    "Win32_System_Registry",
] }
